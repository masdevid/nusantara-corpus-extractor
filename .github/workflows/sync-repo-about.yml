name: Sync repo About

on:
  push:
    branches: [master]
    paths:
      - ".github/repo-about.json"
      - "pyproject.toml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-about:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update repo description and topics
        env:
          # NOTE: The default GITHUB_TOKEN cannot edit repository metadata
          # (description/topics) — it returns HTTP 403. This workflow needs a
          # fine-grained Personal Access Token with "Administration: write"
          # (or "Metadata: write") permission on this repo, stored as the
          # REPO_ABOUT_TOKEN secret. See README "Repo About" section.
          GH_TOKEN: ${{ secrets.REPO_ABOUT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::REPO_ABOUT_TOKEN secret is not set. The default GITHUB_TOKEN cannot edit repo metadata (HTTP 403)."
            echo "::error::Create a fine-grained PAT with 'Administration: write' on this repo and store it as REPO_ABOUT_TOKEN."
            exit 1
          fi

          DESCRIPTION="$(jq -r '.description' .github/repo-about.json)"
          mapfile -t TOPICS < <(jq -r '.topics[]' .github/repo-about.json)

          # Description
          gh repo edit "$GITHUB_REPOSITORY" --description "$DESCRIPTION"

          # Replace topics: remove current ones, then add the canonical list
          CURRENT="$(gh repo view "$GITHUB_REPOSITORY" --json repositoryTopics --jq '.repositoryTopics[].name' 2>/dev/null || true)"
          if [ -n "$CURRENT" ]; then
            for t in $CURRENT; do
              gh repo edit "$GITHUB_REPOSITORY" --delete-topic "$t"
            done
          fi
          for t in "${TOPICS[@]}"; do
            gh repo edit "$GITHUB_REPOSITORY" --add-topic "$t"
          done

          echo "✅ About synced:"
          echo "  description: $DESCRIPTION"
          echo "  topics: ${TOPICS[*]}"
