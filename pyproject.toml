[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nusantara-corpus-extractor"
version = "0.1.0"
description = "Extract quality-checked parallel corpora from local-language dictionary PDFs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "masdevid (DepodTech)" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "pypdfium2>=5.13",
  "pytesseract>=0.3.10",
  "Pillow>=10.0",
]

[project.scripts]
nusantara-corpus-extractor = "cli:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = [
  "cli",
  "corpus_writer",
  "entry_extractor",
  "meaning_crosscheck",
  "models",
  "pattern_spotter",
  "pdf_parser",
  "quality_loop",
  "typo_corrector",
  "web_verification",
]
